services:
  postgres:
    image: postgres:15-alpine
    container_name: savcm-postgres
    ports:
      - "${POSTGRES_HOST_PORT:-55432}:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: savcm
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d savcm"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
